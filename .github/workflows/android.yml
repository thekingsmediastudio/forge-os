name: Android Build (Forge OS)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;25.2.9519653'

      - name: Create persistent debug keystore
        # Ensures every CI build signs with the same debug key so APKs can be
        # installed as updates over previous CI builds without uninstalling.
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          # Disable the remote/local Gradle cache: a poisoned incremental
          # Kotlin compile cache was causing phantom "unresolved reference"
          # errors for symbols that exist in source.
          cache-disabled: true

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        # -Pkotlin.incremental=false forces a full non-incremental Kotlin compile.
        # kotlin.compiler.execution.strategy=in-process bypasses the persistent Kotlin
        # compile daemon, whose stale in-memory state was causing phantom
        # "unresolved reference: spotlightTarget" errors for a symbol that exists.
        # pipefail ensures the gradle exit code (not tee's) determines step success.
        run: |
          set -o pipefail
          ./gradlew :app:clean :app:assembleDebug --no-daemon -Pkotlin.incremental=false -Dkotlin.compiler.execution.strategy=in-process 2>&1 | tee build-log.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
