name: Android Build (Forge OS)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;25.2.9519653'

      - name: Create or restore persistent debug keystore
        id: keystore
        # Every debug APK must be signed with the SAME key, otherwise Android
        # refuses in-place updates (INSTALL_FAILED_UPDATE_INCOMPATIBLE) and
        # forces an uninstall first. Strategy:
        #   1. If repo secret DEBUG_KEYSTORE_B64 exists -> restore that keystore
        #      (this is the normal path; set it once and every build updates cleanly).
        #   2. Otherwise (first run / secret not set yet) -> generate a fresh
        #      keystore and upload it as an artifact so the value can be copied
        #      into the DEBUG_KEYSTORE_B64 secret from the GitHub web UI.
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "Restoring debug keystore from DEBUG_KEYSTORE_B64 secret"
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            # Sanity: the decoded file must be a valid keystore, otherwise every
            # build would silently fall back to a different key later.
            if ! keytool -list -keystore ~/.android/debug.keystore -storepass android >/dev/null 2>&1; then
              echo "::error::DEBUG_KEYSTORE_B64 decoded but is not a valid keystore (bad base64 or wrong storepass)."
              exit 1
            fi
          else
            echo "generated=true" >> "$GITHUB_OUTPUT"
            echo "No DEBUG_KEYSTORE_B64 secret - generating a fresh debug keystore"
            echo "::warning::Building with a THROWAWAY keystore. This APK will NOT update any previous install. Set the DEBUG_KEYSTORE_B64 secret to stop this."
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            base64 -w0 ~/.android/debug.keystore > debug-keystore.b64
          fi

      - name: Upload generated debug keystore (only when secret is missing)
        # Grab debug-keystore.b64 from this artifact, paste its contents into a
        # repo secret named DEBUG_KEYSTORE_B64, then future builds sign with the
        # same key and APKs update in place. Delete the artifact afterwards.
        if: steps.keystore.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore-b64
          path: debug-keystore.b64
          retention-days: 7

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          # Disable the remote/local Gradle cache: a poisoned incremental
          # Kotlin compile cache was causing phantom "unresolved reference"
          # errors for symbols that exist in source.
          cache-disabled: true

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        # -Pkotlin.incremental=false forces a full non-incremental Kotlin compile.
        # kotlin.compiler.execution.strategy=in-process bypasses the persistent Kotlin
        # compile daemon, whose stale in-memory state was causing phantom
        # "unresolved reference: spotlightTarget" errors for a symbol that exists.
        # pipefail ensures the gradle exit code (not tee's) determines step success.
        run: |
          set -o pipefail
          ./gradlew :app:clean :app:assembleDebug --no-daemon -Pkotlin.incremental=false -Dkotlin.compiler.execution.strategy=in-process -PciVersionCode=${{ github.run_number }} 2>&1 | tee build-log.txt

      - name: Print APK signing cert fingerprint
        # Every build logs its SHA-256 cert — compare across runs to confirm the
        # keystore secret stayed stable (a changed value = updates will fail).
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK" | grep "SHA-256"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
